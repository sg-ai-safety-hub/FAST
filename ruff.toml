line-length = 100
# The installable package lives here, not at the repo root — so ruff resolves `fast`
# as first-party (import grouping) rather than treating it as a third-party dependency.
src = ["packages/fast/src"]
# Generated notebooks are derived artifacts, and participant stubs are deliberately
# incomplete (`direction = ...` is unused on purpose). Lint the .py sources instead.
extend-exclude = ["*.ipynb"]

[lint]
# E402: notebooks legitimately import after prose cells and setup calls.
ignore = ["E402"]

[lint.isort]
known-first-party = ["fast"]
